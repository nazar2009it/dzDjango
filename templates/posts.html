<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
</head>
<body>
    {% for post in posts %}
        <h1>{{ post.title }}</h1>
        <p>{{ post.description }}</p>
        <p>{{ post.created }}</p>
        <hr>
    {% empty %}
        <p>Активных постов нет.</p>
    {% endfor %}
</body>
</html>
